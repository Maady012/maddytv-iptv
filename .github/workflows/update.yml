name: Auto Update Playlists & EPG

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: setup-python@v4
        with:
          python-version: '3.x'

      - name: Run EPG & Playlist Builder
        run: |
          python3 generate_epg.py

      - name: Commit and Push
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --staged --quiet || (git commit -m "Auto-update EPG & streams [skip ci]" && git pull --rebase origin main && git push origin main)
